[project]
name = "ghostbusters"
version = "0.1.0"
description = "Find a hidden ghost on a grid using a Hidden Markov Model belief state (pygame)."
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.5,<3",
    "pygame-menu>=4.4,<5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ghostbusters = "ghostbusters.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ghostbusters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
